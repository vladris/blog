<!DOCTYPE html>
<html lang="en-US" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title & }}</title>
<meta name="theme-color" content="#f6f6f3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,400&display=swap">
<link rel="stylesheet" href="./static/tokens.css" type="text/css">
<link rel="stylesheet" href="./static/theme.css" type="text/css">
<link rel="alternate" type="application/rss+xml" title="{{ title & }}" href="rss.xml">
<link rel="shortcut icon" href="./static/icon.ico" />
</head>
<body>
<a class="skip-link" href="#index">Skip to content</a>
<header class="site-header container">
<a class="brand" href="https://vladris.com">{{ author }}</a>
<nav aria-label="Main navigation">
<a href="https://vladris.com/writings/index.html">Writings</a>
<a href="index.html" aria-current="page">Blog</a>
<a href="https://www.linkedin.com/in/vladris">Resume</a>
</nav>
</header>
<main class="container" id="index">
<div class="index-head">
<h1>{{ title & }}.</h1>
<p class="note"><a href="rss.xml">Subscribe with RSS&nbsp;&nearr;</a></p>
</div>
{{ for years }}
<section class="year">
<h2 class="year-label">{{ $item.year }}</h2>
<ul class="posts">
{{ for $item.posts }}
<li><a href="{{ $item.rel_path }}"><time class="date" datetime="{{ $item.date ~ %Y-%m-%d }}">{{ $item.date ~ %b %d }}</time><span class="title">{{ $item.title & }}</span></a></li>
{{ endfor }}
</ul>
</section>
{{ endfor }}
</main>
<footer class="site-footer container">
<span>By <a href="https://vladris.com">{{ author }}</a></span>
<nav aria-label="Blog">
<a href="rss.xml">Subscribe</a>
<a href="index.html">Index</a>
</nav>
</footer>
</body>
</html>
