<!DOCTYPE html>
<html lang="en-US" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ post.title & }} &mdash; Blog</title>
<meta name="theme-color" content="#f6f6f3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,400&display=swap">
<link rel="stylesheet" href="../../../static/tokens.css" type="text/css">
<link rel="stylesheet" href="../../../static/theme.css" type="text/css">
<link rel="alternate" type="application/rss+xml" title="{{ title & }}" href="../../../rss.xml">
<link rel="shortcut icon" href="../../../static/icon.ico" />
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<a class="skip-link" href="#post">Skip to content</a>
<header class="site-header container">
<a class="brand" href="https://vladris.com">{{ author }}</a>
<nav aria-label="Main navigation">
<a href="https://vladris.com/writings/index.html">Writings</a>
<a href="../../../index.html" aria-current="page">Blog</a>
<a href="https://www.linkedin.com/in/vladris">Resume</a>
</nav>
</header>
<main class="container post" id="post">
<p class="post-date"><time datetime="{{ post.date ~ %Y-%m-%d }}">{{ post.date ~ %B %-d, %Y }}</time></p>
<article class="prose">
{{ post.body }}
</article>
</main>
<nav class="container post-nav" aria-label="More posts">
<ul class="ruled-list">
{{ if post.prev }}
<li><a href="{{ post.prev.href }}"><span><span class="dir">Previous</span>{{ post.prev.title & }}</span><span aria-hidden="true">&larr;</span></a></li>
{{ endif }}
{{ if post.next }}
<li><a href="{{ post.next.href }}"><span><span class="dir">Next</span>{{ post.next.title & }}</span><span aria-hidden="true">&rarr;</span></a></li>
{{ endif }}
<li><a href="../../../index.html"><span>All posts</span><span aria-hidden="true">&rarr;</span></a></li>
</ul>
</nav>
<footer class="site-footer container">
<span>By <a href="https://vladris.com">{{ author }}</a></span>
<nav aria-label="Blog">
<a href="../../../rss.xml">Subscribe</a>
<a href="../../../index.html">Index</a>
</nav>
</footer>
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
        startOnLoad: true,
        theme: 'neutral',
        fontFamily: '"IBM Plex Mono", ui-monospace, Menlo, monospace',
    });
</script>
</body>
</html>
